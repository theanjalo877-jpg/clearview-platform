<style>
.ops-hero {position:relative;isolation:isolate;display:grid;grid-template-columns:1fr 1.22fr;align-items:center;
 min-height:360px;overflow:hidden;border:1px solid #91bbf127;border-radius:28px;
 background:radial-gradient(ellipse at 75% 45%,#283c75 0%,transparent 50%),linear-gradient(125deg,#0b1324,#121c38 65%,#172744);
 color:#f3f8ff;box-shadow:0 18px 54px #0a16282e}
.ops-copy {z-index:1;padding:36px 0 38px 44px}
.ops-brand {color:#c1ccff;font:700 .73rem ui-monospace,monospace;letter-spacing:.16em}
.ops-title {color:inherit!important;font-size:clamp(2.3rem,3.9vw,4.05rem)!important;line-height:.99!important;
 font-weight:780!important;letter-spacing:-.06em;margin:.38em 0 .27em!important;padding:0!important}
.ops-hero p {color:#c8d6ed;max-width:380px;margin:0;font-size:clamp(.93rem,1.23vw,1.08rem)}
.ops-art {display:block;width:100%;max-height:396px;overflow:visible}
.ops-panel {animation:ops-lift 1.5s cubic-bezier(.19,1,.22,1) both}
.ops-stock {animation-delay:.23s}
.ops-staff {animation-delay:.47s}
.ops-route {stroke-dasharray:380;animation:ops-trace 1.95s ease-out .32s both}
.ops-route-purple {animation-delay:.65s}
.ops-route-blue {animation-delay:.91s}
.ops-packet {opacity:0;offset-rotate:0deg;animation:ops-travel 1.4s linear 2}
.ops-packet-sales {offset-path:path("M242 104 L291 134 L291 169 L330 192");animation-delay:.85s}
.ops-packet-stock {offset-path:path("M210 250 L254 275 L330 232 L330 192");animation-delay:1.15s}
.ops-packet-staff {offset-path:path("M469 257 L421 284 L364 253 L364 213 L330 192");animation-delay:1.4s}
.ops-bloom {transform-box:fill-box;transform-origin:center;animation:ops-bloom 1s ease-out 3 both;animation-delay:1.45s}
.ops-bar {transform-box:fill-box;transform-origin:center bottom;animation:ops-grow .95s cubic-bezier(.19,1,.22,1) .5s both}
.ops-bar:nth-child(2) {animation-delay:.7s}
.ops-bar:nth-child(3) {animation-delay:.9s}
@keyframes ops-lift {from {transform:translateY(26px);opacity:0}to {transform:translateY(0);opacity:1}}
@keyframes ops-trace {from {stroke-dashoffset:380;opacity:0}to {stroke-dashoffset:0;opacity:1}}
@keyframes ops-travel {0% {offset-distance:0%;opacity:0}14%,85% {opacity:1}100% {offset-distance:100%;opacity:0}}
@keyframes ops-bloom {0% {transform:scale(.66);opacity:.65}100% {transform:scale(1.85);opacity:0}}
@keyframes ops-grow {from {transform:scaleY(.08);opacity:.32}to {transform:scaleY(1);opacity:1}}
@media(max-width:680px) {
 .ops-hero{grid-template-columns:1fr;min-height:0}
 .ops-copy{padding:28px 23px 0}
 .ops-art{width:min(100%,470px);max-height:240px;justify-self:center;margin-top:-6px}
}
@media(prefers-reduced-motion:reduce){
 .ops-hero *{animation:none!important}
}
</style>
