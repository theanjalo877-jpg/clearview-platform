<style>
.block-container {max-width:1320px}
.cv-hero {position:relative;isolation:isolate;display:grid;grid-template-columns:1fr 1.15fr;align-items:center;
 min-height:360px;overflow:hidden;border-radius:28px;box-shadow:0 18px 54px #0a16282e;
 background:radial-gradient(ellipse at 77% 69%,#16495b 0%,transparent 44%),linear-gradient(125deg,#0b1324,#101e36 64%,#122b43);color:#f3f8ff}
.cv-hero::after {content:"";position:absolute;inset:0;pointer-events:none;border:1px solid #9af6ed31;border-radius:inherit}
.cv-copy {z-index:1;padding:38px 0 40px 44px}
.cv-brand {font:700 .73rem ui-monospace,monospace;letter-spacing:.16em;color:#9aefdc}
.cv-title {font-size:clamp(2.35rem,3.95vw,4.15rem)!important;line-height:.96!important;font-weight:780!important;letter-spacing:-.06em;margin:.38em 0 .27em!important;padding:0!important;color:inherit!important}
.cv-hero p {max-width:345px;color:#c4d6e7;font-size:clamp(.92rem,1.25vw,1.08rem);margin:0}
.cv-art {width:100%;display:block;overflow:visible}
.cv-grid {animation:cv-reveal 1.1s ease-out both}
.cv-layer {animation:cv-rise 1.35s cubic-bezier(.19,1,.22,1) both}
.cv-layer + .cv-layer {animation-delay:.19s}
.cv-layer + .cv-layer + .cv-layer {animation-delay:.32s}
.cv-wire {stroke-dasharray:900;stroke-dashoffset:0;animation:cv-draw 2.45s cubic-bezier(.23,1,.32,1) both}
.cv-packet {offset-rotate:0deg;opacity:0;animation:cv-transfer 2s linear 2}
.cv-in {offset-path:path("M52 197 L148 250 L275 181 L379 236");animation-delay:.35s}
.cv-out {offset-path:path("M288 181 L376 130 L452 172 L533 126");animation-delay:.68s}
.cv-pulse {transform-box:fill-box;transform-origin:center;animation:cv-signal 1.6s ease-out 3 both}
@keyframes cv-reveal {from {opacity:0}to {opacity:1}}
@keyframes cv-rise {from {transform:translateY(32px);opacity:0}to {transform:translateY(0);opacity:1}}
@keyframes cv-draw {from {stroke-dashoffset:900;opacity:.25}to {stroke-dashoffset:0;opacity:1}}
@keyframes cv-transfer {0% {offset-distance:0%;opacity:0}12%,87% {opacity:1}100% {offset-distance:100%;opacity:0}}
@keyframes cv-signal {0% {transform:scale(.68);opacity:.65}100% {transform:scale(1.65);opacity:0}}
@media(max-width:680px){
 .cv-hero{grid-template-columns:1fr;min-height:0}
 .cv-copy{padding:28px 24px 0}
 .cv-art{width:min(100%,470px);max-height:222px;justify-self:center;margin-top:-12px}
}
@media(prefers-reduced-motion:reduce){.cv-hero *{animation:none!important}}
[data-testid="stMetric"] {background:#fff;border:1px solid #dbe8eb;border-radius:16px;padding:14px}
</style>
